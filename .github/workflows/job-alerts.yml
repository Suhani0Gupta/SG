name: Job alerts
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      test:
        description: Send a test alert
        type: boolean
        default: false
permissions:
  contents: write
  issues: write
concurrency:
  group: job-alerts
  cancel-in-progress: false
jobs:
  alerts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check for new jobs
        run: node scripts/job-alerts.mjs
        env:
          TEST: ${{ inputs.test }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ADZUNA_ID: ${{ secrets.ADZUNA_ID }}
          ADZUNA_KEY: ${{ secrets.ADZUNA_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Save the list of jobs already seen
        run: |
          git config user.name "job-alert-bot"
          git config user.email "job-alert-bot@users.noreply.github.com"
          git add alerts/seen.json || true
          git diff --staged --quiet || (git commit -m "Update seen jobs" && git push)
